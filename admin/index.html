<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel Admin — Ferretería Ukra</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1e1b15">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#0f172a;color:#e2e8f0;line-height:1.6}
a{color:#d4a94b;text-decoration:none}

/* Login */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.login-box{background:#1e293b;border-radius:16px;padding:40px;width:100%;max-width:380px;text-align:center;border:1px solid #334155}
.login-box h1{font-size:1.3rem;font-weight:800;margin-bottom:4px;color:#fff}
.login-box p{color:#94a3b8;font-size:.85rem;margin-bottom:24px}
.login-box input{width:100%;padding:12px 14px;border:1px solid #334155;border-radius:10px;background:#0f172a;color:#e2e8f0;font-size:.95rem;font-family:inherit;margin-bottom:12px}
.login-box input:focus{outline:none;border-color:#a97b23}
.login-box button{width:100%;padding:12px;background:#a97b23;color:#fff;border:none;border-radius:999px;font-weight:700;font-size:.95rem;cursor:pointer;font-family:inherit;transition:.2s}
.login-box button:hover{background:#8c6419}
.login-err{color:#f87171;font-size:.8rem;margin-top:8px;display:none}

/* Dashboard */
.dashboard{display:none}
.dash-header{background:#1e293b;border-bottom:1px solid #334155;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.dash-header h1{font-size:1.1rem;font-weight:800;color:#fff}
.dash-header .logo span{color:#a97b23}
.btn-logout{background:#334155;color:#e2e8f0;border:none;padding:8px 16px;border-radius:8px;font-size:.8rem;font-weight:600;cursor:pointer;font-family:inherit}
.btn-logout:hover{background:#475569}

.dash-body{max-width:1100px;margin:0 auto;padding:24px 16px}

/* Stats grid */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:28px}
.stat-card{background:#1e293b;border-radius:12px;padding:18px;border:1px solid #334155}
.stat-card .label{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:#94a3b8;font-weight:700}
.stat-card .value{font-size:1.6rem;font-weight:800;color:#fff;margin-top:4px}
.stat-card .value.revenue{color:#4ade80}

/* Filters */
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{background:#1e293b;color:#94a3b8;border:1px solid #334155;padding:8px 16px;border-radius:999px;font-size:.8rem;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
.filter-btn:hover,.filter-btn.active{background:#334155;color:#fff;border-color:#475569}

/* Orders table */
.orders-wrap{background:#1e293b;border-radius:12px;border:1px solid #334155;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{text-align:left;padding:12px 14px;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:#64748b;border-bottom:1px solid #334155;font-weight:700;white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid #1e293b;vertical-align:top}
tr:hover td{background:#0f172a44}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.7rem;font-weight:700;text-transform:uppercase}
.badge-paid{background:#064e3b;color:#6ee7b7}
.badge-pending{background:#78350f;color:#fcd34d}
.badge-rejected{background:#7f1d1d;color:#fca5a5}
.badge-cancelled{background:#374151;color:#9ca3af}
.badge-error{background:#7f1d1d;color:#fca5a5}

.products-list{font-size:.75rem;color:#94a3b8;max-width:280px}

/* Pagination */
.pagination{display:flex;justify-content:center;gap:8px;padding:16px}
.page-btn{background:#334155;color:#e2e8f0;border:none;padding:6px 14px;border-radius:8px;font-size:.8rem;cursor:pointer;font-family:inherit}
.page-btn:hover{background:#475569}
.page-btn.active{background:#a97b23;color:#fff}

.empty-msg{text-align:center;padding:40px;color:#64748b;font-size:.9rem}

/* Order detail modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center;padding:16px}
.modal{background:#1e293b;border-radius:16px;border:1px solid #334155;max-width:500px;width:100%;max-height:80vh;overflow-y:auto;padding:28px}
.modal h2{font-size:1.1rem;font-weight:800;color:#fff;margin-bottom:16px}
.modal .detail-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #334155;font-size:.85rem}
.modal .detail-row .lbl{color:#94a3b8}
.modal .detail-row .val{color:#e2e8f0;font-weight:600;text-align:right}
.modal .close-btn{display:block;width:100%;margin-top:20px;padding:10px;background:#334155;color:#e2e8f0;border:none;border-radius:10px;font-weight:600;cursor:pointer;font-family:inherit;font-size:.9rem}
.modal .close-btn:hover{background:#475569}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-wrap" id="login-screen">
  <div class="login-box">
    <h1>🔒 Panel Admin</h1>
    <p>Ferretería Ukra — Gestión de órdenes</p>
    <input type="password" id="admin-pass" placeholder="Contraseña" autofocus>
    <button id="login-btn" onclick="doLogin()">Ingresar</button>
    <div class="login-err" id="login-err">Contraseña incorrecta</div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
  <div class="dash-header">
    <h1><span class="logo">Ferretería <span>Ukra</span></span> — Admin</h1>
    <button class="btn-logout" onclick="doLogout()">Cerrar sesión</button>
  </div>

  <div class="dash-body">
    <!-- Stats -->
    <div class="stats-grid" id="stats-grid">
      <div class="stat-card"><div class="label">Total órdenes</div><div class="value" id="s-total">—</div></div>
      <div class="stat-card"><div class="label">Pagadas</div><div class="value" id="s-paid">—</div></div>
      <div class="stat-card"><div class="label">Pendientes</div><div class="value" id="s-pending">—</div></div>
      <div class="stat-card"><div class="label">Ingresos totales</div><div class="value revenue" id="s-revenue">—</div></div>
      <div class="stat-card"><div class="label">Hoy (pagadas)</div><div class="value" id="s-today">—</div></div>
      <div class="stat-card"><div class="label">Ingresos hoy</div><div class="value revenue" id="s-today-rev">—</div></div>
    </div>

    <!-- Filters -->
    <div class="filters">
      <button class="filter-btn active" data-status="all">Todas</button>
      <button class="filter-btn" data-status="paid">Pagadas</button>
      <button class="filter-btn" data-status="pending">Pendientes</button>
      <button class="filter-btn" data-status="rejected">Rechazadas</button>
      <button class="filter-btn" data-status="cancelled">Canceladas</button>
    </div>

    <!-- Orders table -->
    <div class="orders-wrap">
      <table>
        <thead>
          <tr>
            <th>Orden</th>
            <th>Cliente</th>
            <th>Productos</th>
            <th>Total</th>
            <th>Estado</th>
            <th>Fecha</th>
          </tr>
        </thead>
        <tbody id="orders-body">
          <tr><td colspan="6" class="empty-msg">Cargando…</td></tr>
        </tbody>
      </table>
    </div>

    <div class="pagination" id="pagination"></div>
  </div>
</div>

<!-- Order Detail Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-content" onclick="event.stopPropagation()"></div>
</div>

<script>
(function(){
  'use strict';

  let token = '';
  let currentStatus = 'all';
  let currentPage = 1;

  const $ = id => document.getElementById(id);
  const fmt = n => '$' + Number(n).toLocaleString('es-CL');

  // Restore session
  try { token = sessionStorage.getItem('ukra_admin') || ''; } catch {}
  if (token) showDashboard();

  // Login
  window.doLogin = async function() {
    const pass = $('admin-pass').value.trim();
    if (!pass) return;
    token = pass;
    try {
      const res = await apiFetch('/api/admin/stats');
      if (res.ok) {
        try { sessionStorage.setItem('ukra_admin', token); } catch {}
        showDashboard();
      } else {
        token = '';
        $('login-err').style.display = 'block';
      }
    } catch {
      token = '';
      $('login-err').style.display = 'block';
    }
  };

  $('admin-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

  window.doLogout = function() {
    token = '';
    try { sessionStorage.removeItem('ukra_admin'); } catch {}
    $('dashboard').style.display = 'none';
    $('login-screen').style.display = 'flex';
    $('admin-pass').value = '';
    $('login-err').style.display = 'none';
  };

  function apiFetch(url) {
    return fetch(url, { headers: { 'Authorization': 'Bearer ' + token } });
  }

  async function showDashboard() {
    $('login-screen').style.display = 'none';
    $('dashboard').style.display = 'block';
    await Promise.all([loadStats(), loadOrders()]);
  }

  async function loadStats() {
    try {
      const res = await apiFetch('/api/admin/stats');
      const d = await res.json();
      $('s-total').textContent = d.total_orders;
      $('s-paid').textContent = d.paid_orders;
      $('s-pending').textContent = d.pending_orders;
      $('s-revenue').textContent = fmt(d.total_revenue);
      $('s-today').textContent = d.today_orders;
      $('s-today-rev').textContent = fmt(d.today_revenue);
    } catch {}
  }

  async function loadOrders() {
    const body = $('orders-body');
    body.innerHTML = '<tr><td colspan="6" class="empty-msg">Cargando…</td></tr>';
    try {
      const res = await apiFetch(`/api/admin/orders?status=${currentStatus}&page=${currentPage}`);
      const d = await res.json();

      if (!d.orders.length) {
        body.innerHTML = '<tr><td colspan="6" class="empty-msg">No hay órdenes</td></tr>';
        $('pagination').innerHTML = '';
        return;
      }

      body.innerHTML = d.orders.map(o => {
        const prods = o.products.map(p => `${p.name} ×${p.quantity}`).join(', ');
        const date = new Date(o.created_at).toLocaleDateString('es-CL', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
        const badge = `badge-${o.status}`;
        return `<tr style="cursor:pointer" onclick='showOrder(${JSON.stringify(o).replace(/'/g,"&#39;")})'>
          <td><strong>${o.order_number}</strong></td>
          <td>${o.customer_name}<br><small style="color:#64748b">${o.customer_email}</small></td>
          <td class="products-list">${prods}</td>
          <td style="white-space:nowrap;font-weight:700">${fmt(o.total)}</td>
          <td><span class="badge ${badge}">${o.status}</span></td>
          <td style="white-space:nowrap;font-size:.78rem">${date}</td>
        </tr>`;
      }).join('');

      // Pagination
      let pages = '';
      for (let i = 1; i <= d.pages; i++) {
        pages += `<button class="page-btn${i === d.page ? ' active' : ''}" onclick="goPage(${i})">${i}</button>`;
      }
      $('pagination').innerHTML = pages;
    } catch {
      body.innerHTML = '<tr><td colspan="6" class="empty-msg">Error al cargar órdenes</td></tr>';
    }
  }

  window.goPage = function(p) { currentPage = p; loadOrders(); };

  // Filters
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentStatus = btn.dataset.status;
      currentPage = 1;
      loadOrders();
    };
  });

  // Order detail modal
  window.showOrder = function(o) {
    const mc = $('modal-content');
    const prods = o.products.map(p => `
      <div class="detail-row">
        <span class="lbl">${p.name} ×${p.quantity}</span>
        <span class="val">${fmt(p.price * p.quantity)}</span>
      </div>
    `).join('');

    mc.innerHTML = `
      <h2>Orden ${o.order_number}</h2>
      <div class="detail-row"><span class="lbl">Estado</span><span class="val"><span class="badge badge-${o.status}">${o.status}</span></span></div>
      <div class="detail-row"><span class="lbl">Cliente</span><span class="val">${o.customer_name}</span></div>
      <div class="detail-row"><span class="lbl">Email</span><span class="val">${o.customer_email}</span></div>
      ${o.customer_phone ? `<div class="detail-row"><span class="lbl">Teléfono</span><span class="val">${o.customer_phone}</span></div>` : ''}
      ${o.customer_comuna ? `<div class="detail-row"><span class="lbl">Comuna</span><span class="val">${o.customer_comuna}</span></div>` : ''}
      <div style="margin:16px 0 8px;font-size:.75rem;color:#64748b;text-transform:uppercase;font-weight:700">Productos</div>
      ${prods}
      <div class="detail-row" style="border-top:2px solid #475569;margin-top:8px;padding-top:10px">
        <span class="lbl" style="font-weight:800;color:#fff">Total</span>
        <span class="val" style="font-size:1.1rem;color:#4ade80">${fmt(o.total)}</span>
      </div>
      <div class="detail-row"><span class="lbl">Fecha</span><span class="val">${new Date(o.created_at).toLocaleString('es-CL')}</span></div>
      ${o.paid_at ? `<div class="detail-row"><span class="lbl">Pagado</span><span class="val">${new Date(o.paid_at).toLocaleString('es-CL')}</span></div>` : ''}
      ${o.payment_method ? `<div class="detail-row"><span class="lbl">Método</span><span class="val">${o.payment_method}</span></div>` : ''}
      ${o.flow_order ? `<div class="detail-row"><span class="lbl">Flow Order</span><span class="val">${o.flow_order}</span></div>` : ''}
      <button class="close-btn" onclick="closeModal()">Cerrar</button>
    `;
    $('modal-overlay').style.display = 'flex';
  };

  window.closeModal = function(e) {
    if (!e || e.target === $('modal-overlay')) {
      $('modal-overlay').style.display = 'none';
    }
  };
})();
</script>
</body>
</html>
